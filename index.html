<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kithan App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="dashboard-container">
        <div class="logo-area">
            <h1><span class="highlight">K</span>ithan App</h1>
            <p>Abnahme & Übergabe Protokolle</p>
        </div>

        <div id="view-objektart" class="button-grid">
            <button class="main-btn" data-objektart="gewerbe">Gewerbe</button>
            <button class="main-btn" data-objektart="privat">Privat</button>
            <button class="main-btn" data-objektart="garage">Garage</button>
        </div>

        <div id="view-protokollart" class="button-grid hidden">
            <h2 style="margin-bottom: 20px; font-size: 1.2rem;" id="gewaehlte-objektart"></h2>
            <button class="main-btn" data-protokollart="abnahme">Abnahme</button>
            <button class="main-btn" data-protokollart="uebergabe">Übergabe</button>
            <button class="main-btn" id="btn-zurueck" style="border-color: #ff3333; margin-top: 20px;">Zurück</button>
        </div>

        <div id="view-formular" class="form-container hidden">
            <h2 style="margin-bottom: 20px;">Kopfdaten</h2>

            <div class="input-group">
                <label>Name der/des Mieter(s):</label>
                <input type="text" id="mietername" placeholder="z.B. Max Mustermann">
            </div>

            <div class="input-group">
                <label>Besichtigte Wohnung:</label>
                <select id="gebaeude-auswahl">
                    <option value="" disabled selected>Bitte Gebäude wählen...</option>
                    <option value="dummy1">Musterstraße 1, 12345 Stadt</option>
                    <option value="dummy2">Beispielweg 10, 67890 Ort</option>
                </select>
            </div>

            <div class="input-group">
                <label>Bei der Besichtigung der Wohnung am:</label>
                <input type="date" id="besichtigungsdatum">
            </div>

            <div class="radio-group" style="margin-top: 10px; margin-bottom: 40px;">
                <label style="margin-right: 15px;">...wurden:</label>
                <input type="radio" id="keine-maengel" name="maengel-status" value="keine">
                <label for="keine-maengel" style="margin-right: 15px;">keine</label>

                <input type="radio" id="folgende-maengel" name="maengel-status" value="folgende">
                <label for="folgende-maengel">folgende Mängel festgestellt:</label>
            </div>

            <h3 style="margin-top: 40px; margin-bottom: 20px; color: var(--neon-green);">Zustand der Räume</h3>

            <div id="rooms-container"></div>

            <div id="meters-container"></div>

            <button class="main-btn" id="btn-neustart" style="border-color: #ff3333; margin-top: 30px;">Neustart (Abbrechen)</button>
        </div>
    </main>

    <script src="dist/app.js"></script>
</body>
</html>
