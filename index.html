<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kithan Vermietung</title>
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kithan Vermietung">
</head>
<body>

    <main class="dashboard-container">
        <div class="logo-area">
            <h1 id="app-title"><span class="highlight">K</span>ithan <span class="highlight">V</span>ermietung</h1>
            <p id="app-subtitle">Übergabe & Rücknahme Protokolle</p>
            <p id="app-build-stamp" class="app-build-stamp"></p>
        </div>

        <div id="view-objektart" class="button-grid">
            <button class="main-btn" data-objektart="gewerbe">Gewerbe</button>
            <button class="main-btn" data-objektart="privat">Privat</button>
            <button class="main-btn" data-objektart="garage">Garage</button>
            <button class="main-btn" data-objektart="schluessel">Schlüssel</button>
            <button class="main-btn btn-drafts" id="btn-meine-entwuerfe" type="button">Meine Entwürfe</button>
        </div>

        <div id="view-protokollart" class="button-grid hidden">
            <h2 style="margin-bottom: 20px; font-size: 1.2rem;" id="gewaehlte-objektart"></h2>
            <button class="main-btn" data-protokollart="uebergabe">Übergabe</button>
            <button class="main-btn" data-protokollart="ruecknahme">Rücknahme</button>
            <button class="main-btn btn-back" id="btn-zurueck">Zurück</button>
        </div>

        <div id="view-entwuerfe" class="form-container hidden">
            <h2 class="section-title" style="margin-top: 0;">Meine Entwürfe</h2>
            <p id="entwuerfe-empty" class="draft-empty hidden">Keine gespeicherten Entwürfe.</p>
            <div id="entwuerfe-list"></div>
            <button class="main-btn btn-back" id="btn-zurueck-entwuerfe" type="button">Zurück</button>
        </div>

        <div id="view-formular" class="form-container hidden">
            <div id="form-standard">
                <h2 class="heading-kopfdaten" style="margin-bottom: 20px;">Kopfdaten</h2>

                <div class="input-group">
                    <label for="vermieter-auswahl">Vermieter:</label>
                    <select id="vermieter-auswahl">
                        <option value="" disabled selected>Bitte Vermieter wählen...</option>
                        <option value="kithan-grundstuecks-handels">Kithan Grundstücks- und Handels GmbH</option>
                        <option value="kithan-gmbh">Kithan GmbH</option>
                        <option value="kithan-leopoldstrasse">Kithan Leopoldstraße GmbH</option>
                        <option value="kithan-erlangen">Kithan Erlangen GmbH</option>
                        <option value="kithan-erlangen-mvs">Kithan Erlangen MVS GmbH</option>
                        <option value="kita-projekt-koeln">Kita Projekt Köln</option>
                        <option value="kithan-koeln-hyazinthenweg">Kithan Köln GmbH Hyazinthenweg</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Name der/des Mieter(s):</label>
                    <input type="text" id="mietername" placeholder="z.B. Max Mustermann">
                </div>

                <div class="input-group">
                    <label id="label-besichtigt">Wohnung/Einheit:</label>
                    <select id="gebaeude-auswahl">
                        <option value="" disabled selected>Bitte Gebäude wählen...</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="kopfdaten-bemerkung">Bemerkung:</label>
                    <input type="text" id="kopfdaten-bemerkung" placeholder="Zusätzliche Bemerkung...">
                </div>

                <div class="input-group">
                    <label id="label-besichtigungsdatum">Datum der Übergabe</label>
                    <input type="date" id="besichtigungsdatum">
                </div>

                <div class="radio-group" style="margin-top: 10px; margin-bottom: 40px;">
                    <label style="margin-right: 15px;">...wurden:</label>
                    <input type="radio" id="keine-maengel" name="maengel-status" value="keine">
                    <label for="keine-maengel" style="margin-right: 15px;">keine Mängel festgestellt</label>

                    <input type="radio" id="folgende-maengel" name="maengel-status" value="folgende">
                    <label for="folgende-maengel">folgende Mängel festgestellt:</label>
                </div>

                <h3 id="heading-raeume" style="margin-top: 40px; margin-bottom: 20px; color: var(--neon-green);">Zustand der Räume</h3>

                <div id="rooms-container"></div>

                <div id="meters-container"></div>

                <div id="closing-container"></div>

                <div id="signature-container"></div>
            </div>

            <div id="form-schluessel" class="hidden">
                <h2 class="heading-kopfdaten" style="margin-bottom: 20px;">Schlüssel</h2>

                <div class="input-group">
                    <label for="schluessel-mietername">Name des Mieters:</label>
                    <input type="text" id="schluessel-mietername" placeholder="z.B. Max Mustermann">
                </div>

                <div class="input-group">
                    <label for="schluessel-wohnung">Wohnung/Einheit:</label>
                    <input type="text" id="schluessel-wohnung" placeholder="z.B. Musterstraße 1">
                </div>

                <div id="schluessel-entries-container"></div>

                <div class="input-group">
                    <label for="schluessel-bemerkungen">Sonstiges/Bemerkungen</label>
                    <textarea id="schluessel-bemerkungen" rows="3" placeholder="Weitere Hinweise oder Anmerkungen..."></textarea>
                </div>

                <div id="signature-container-schluessel"></div>
            </div>

            <p id="draft-status" class="draft-status hidden" role="status"></p>

            <button class="main-btn btn-save-draft" id="btn-entwurf-speichern" type="button">Als Entwurf speichern</button>
            <button class="main-btn btn-back" id="btn-zurueck-formular" type="button">Zurück</button>
            <button class="main-btn btn-neustart" id="btn-neustart" type="button">Neustart (Abbrechen)</button>
        </div>
    </main>

    <script type="module" src="/src/app.ts"></script>
    <script>
      // Offline-Startfähigkeit: Service Worker cacht Kern-Dateien (HTML/CSS/JS/Icons).
      //
      // Ein bereits geöffnetes Fenster/PWA behält den einmal geladenen JS-Bundle
      // im Speicher, auch wenn im Hintergrund eine neue Version deployt wird.
      // Deshalb: neue Version aktiv werden lassen (skipWaiting/clients.claim im
      // Service Worker) UND die Seite automatisch einmal neu laden, sobald ein
      // neuer Service Worker die Kontrolle übernimmt — sonst könnten Nutzer
      // dauerhaft eine veraltete Version sehen, ohne es zu merken.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/service-worker.js")
            .then((registration) => {
              console.log(
                "[sw-registration] registered, active worker script:",
                registration.active ? registration.active.scriptURL : "(none yet)"
              );

              if (registration.installing) {
                console.log("[sw-registration] a new service worker is installing…");
              }
              registration.addEventListener("updatefound", () => {
                const installing = registration.installing;
                console.log("[sw-registration] update found, new worker state:", installing && installing.state);
                if (installing) {
                  installing.addEventListener("statechange", () => {
                    console.log("[sw-registration] new worker state changed to:", installing.state);
                  });
                }
              });

              registration.update().catch(() => {});
              document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") {
                  registration.update().catch(() => {});
                }
              });
              setInterval(() => {
                registration.update().catch(() => {});
              }, 60 * 60 * 1000);
            })
            .catch((error) => {
              console.error("Service-Worker-Registrierung fehlgeschlagen:", error);
            });
        });

        let reloadedForNewVersion = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          console.log("[sw-registration] controllerchange — a new service worker just took control");
          if (reloadedForNewVersion) {
            return;
          }
          reloadedForNewVersion = true;
          window.location.reload();
        });
      }
    </script>
</body>
</html>
